name: Tests Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit Tests (C with ASan and UBSan, Python)
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-environment

      - name: Lower ASLR entropy (ASan crashes at startup with the runner default)
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: C unit tests
        run: make test-unit PY=.venv/bin/python

      - name: Python unit tests
        run: .venv/bin/python -m pytest tests/python

  e2e:
    name: E2E (menu and runner on SDL, mock core and mock games)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-environment

      - name: Build the test binaries
        run: make test-bins PY=.venv/bin/python

      - name: Menu and runner
        run: .venv/bin/python -m pytest tests/e2e/test_menu.py tests/e2e/test_game.py

  arm:
    name: ARM menu under qemu
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-environment

      - name: Cross-compile the stick menu
        run: make out/menu-arm CROSS=arm-linux-gnueabi- PY=.venv/bin/python

      - name: Run it under qemu
        run: .venv/bin/python -m pytest tests/e2e/test_arm.py
